name: Weekly Market Intelligence Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * 0"

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Market Intelligence Agent
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python src/main.py

      - name: Commit and push generated outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data charts reports
          git commit -m "Generate weekly market intelligence report" || echo "No changes to commit"
          git push
